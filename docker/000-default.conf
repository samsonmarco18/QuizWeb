<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/html
    RedirectMatch 302 ^/$ /QuizWeb/
    Alias /QuizWeb /var/www/html/QuizWeb
    <Directory /var/www/html/QuizWeb>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
